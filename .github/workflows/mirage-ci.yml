name: Mirage CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'emulation/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/mirage-ci.yml'
      - '!emulation/**/*.md'
  push:
    branches: [main, develop]
    paths:
      - 'emulation/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/mirage-ci.yml'

concurrency:
  group: mirage-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"
  # Cargo workspace members live under emulation/, but the workspace manifest is
  # at the repo root, so cargo commands run from the repo root.
  CARGO_PACKAGES: >-
    -p mirage
    -p mirage_ctl
    -p mirage_daemon
    -p mirage_macros
    -p mirage_real
    -p mirage_remote
    -p mirage_rocjitsu
    -p mirage_schema
    -p mirage_uapi
    -p mirage_container
    -p mirage_interceptor
    -p rocjitsu_sys

jobs:
  # --------------------------------------------------------------------------
  # Fast lint pass: formatting + clippy. Fails fast before spending time on
  # the full build/test matrix.
  # --------------------------------------------------------------------------
  rust-lint:
    name: Rust Lint (fmt + clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $(grep -vE '^\s*(#|$)' emulation/apt.txt | xargs) \
            pkg-config build-essential

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mirage-lint
          cache-on-failure: true

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy ${{ env.CARGO_PACKAGES }} --all-targets --locked -- -D warnings

  # --------------------------------------------------------------------------
  # Build + unit/integration tests for the Rust workspace.
  # Uses cargo-nextest for faster, parallel test execution.
  # --------------------------------------------------------------------------
  rust-test:
    name: Rust Build & Test
    runs-on: ubuntu-22.04
    needs: rust-lint
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $(grep -vE '^\s*(#|$)' emulation/apt.txt | xargs) \
            pkg-config build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mirage-test
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo build
        run: cargo build ${{ env.CARGO_PACKAGES }} --locked --all-targets

      - name: cargo nextest run
        run: cargo nextest run ${{ env.CARGO_PACKAGES }} --locked --all-targets --no-fail-fast

      - name: cargo test --doc
        run: cargo test ${{ env.CARGO_PACKAGES }} --locked --doc

      - name: Upload mirage_daemon binary for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: mirage_daemon-debug
          path: target/debug/mirage_daemon
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------------------------------------
  # Dashboard: typecheck, lint, unit tests, and production build.
  # --------------------------------------------------------------------------
  dashboard:
    name: Dashboard (lint + build + unit tests)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: emulation/dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: emulation/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check + production build
        run: npm run build

      - name: Unit tests (vitest)
        run: npm test

      - name: Upload built dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: emulation/dashboard/dist
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------------------------------------
  # End-to-end tests: Playwright drives the mirage_daemon + dashboard together.
  # Depends on both the rust binary and the dashboard build.
  # --------------------------------------------------------------------------
  dashboard-e2e:
    name: Dashboard E2E (Playwright)
    runs-on: ubuntu-22.04
    needs: [rust-test, dashboard]
    defaults:
      run:
        working-directory: emulation/dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: emulation/dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Download mirage_daemon binary
        uses: actions/download-artifact@v4
        with:
          name: mirage_daemon-debug
          path: target/debug
      # The playwright webServer builds the binary via cargo; prime the cache
      # so the build is a no-op when the artifact is present.
      - name: Mark mirage_daemon executable
        run: chmod +x ../../target/debug/mirage_daemon

      - name: Install Rust toolchain (for playwright webServer build check)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache cargo (reuse from rust-test)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mirage-test
          save-if: "false"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            emulation/dashboard/playwright-report
            emulation/dashboard/test-results
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # Aggregate status check — use this as the required status in branch
  # protection so downstream changes don't require updating the rule set.
  # --------------------------------------------------------------------------
  mirage-ci:
    name: Mirage CI
    runs-on: ubuntu-22.04
    needs: [rust-lint, rust-test, dashboard, dashboard-e2e]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.rust-lint.result }}" != "success" ] \
          || [ "${{ needs.rust-test.result }}" != "success" ] \
          || [ "${{ needs.dashboard.result }}" != "success" ] \
          || [ "${{ needs.dashboard-e2e.result }}" != "success" ]; then
            echo "One or more Mirage CI jobs failed."
            exit 1
          fi
          echo "All Mirage CI jobs succeeded."
