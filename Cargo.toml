[workspace]
resolver = "3"
members = ["emulation/mirage/mirage_*", "emulation/mirage/rocjitsu_sys", "projects/amdgpu_uapi"]

[workspace.dependencies]
serde = { version = "1" }
serde_json = { version = "1" }
serde_bare = { version = "0.5" }
async-trait = { version = "0.1.89" }
paste = { version = "1" }
thiserror = { version = "2" }
libc = { version = "0.2" }
nix = { version = "0.29", default-features = false, features = ["term", "user"] }
bytes = { version = "1" }
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-util", "io-std", "sync", "fs", "process"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = { version = "0.8", features = ["html_reports"] }
axum = { version = "0.8" }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
futures-util = { version = "0.3" }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = { version = "2" }

amdgpu_protocol = { path = "emulation/mirage/amdgpu_protocol" }
mirage_schema = { path = "emulation/mirage/mirage_schema" }
mirage_ctl = { path = "emulation/mirage/mirage_ctl" }
mirage_daemon = { path = "emulation/mirage/mirage_daemon" }
mirage_macros = { path = "emulation/mirage/mirage_macros" }
mirage_real = { path = "emulation/mirage/mirage_real" }
mirage_remote = { path = "emulation/mirage/mirage_remote" }
mirage_rocjitsu = { path = "emulation/mirage/mirage_rocjitsu" }
mirage_uapi = { path = "emulation/mirage/mirage_uapi" }
rocjitsu_sys = { path = "emulation/mirage/rocjitsu_sys" }
